<!doctype html><html><head><meta charset="utf-8"><style>*{box-sizing:border-box;margin:0}body{width:1440px;height:900px;overflow:hidden;background:#F5F4F7;font-family:"Helvetica Neue",Arial,sans-serif;color:#25232C;position:relative}
header{display:flex;justify-content:space-between;align-items:center;height:84px;padding:0 72px;border-bottom:1px solid #DEDBE4}
.logo{font:400 30px Georgia,serif;letter-spacing:-.01em}nav{display:flex;gap:36px;font-size:16px;align-items:center}
.cloth{background-color:var(--c,#B9A6E0);background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.08) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 1px,transparent 1px 3px)}
.l{background:#FBFAFC;padding:10px 16px;font-size:15px;box-shadow:0 1px 0 rgba(0,0,0,.08)}
h1{font:400 58px/1.04 Georgia,serif;letter-spacing:-.02em}
.tile{display:flex;flex-direction:column}.tile .cloth{height:250px;display:grid;place-items:center}.tile .cloth i{width:52%;height:64%;background:#FBFAFC;box-shadow:0 14px 24px -14px rgba(37,35,44,.4)}
.meta{display:flex;justify-content:space-between;padding:14px 2px 0;font-size:15px}.meta b{font:400 24px Georgia,serif}
.lilac{--c:#B9A6E0}.pink{--c:#E6B6C6}.blue{--c:#B3D0E5}.grey{--c:#D7D3DD}
.num{font-variant-numeric:tabular-nums}
.band{height:210px;display:flex;align-items:center;padding:0 72px}
.wrap{display:grid;grid-template-columns:1fr 280px;gap:44px;padding:40px 72px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.card{position:relative;height:400px}.c{position:absolute;inset:0;border:1px solid #25232C}
.c3{background:#B3D0E5;transform:translate(10px,10px)}.c2{background:#E6B6C6;transform:translate(5px,5px)}
.c1{background:#fff;padding:22px}.c1 h2{font:400 26px Georgia,serif}.c1 small{display:block;margin:6px 0 16px}
.line{border-bottom:1px solid #DEDBE4;height:44px}.tot{font:400 24px Georgia,serif;margin-top:18px}
.go{position:absolute;left:22px;right:22px;bottom:22px;background:#25232C;color:#fff;padding:14px;text-align:center;font-weight:700}
</style></head><body>
<header><div class="logo">Choco Makes</div><nav><a>Shop</a><a>Updates</a><a>About</a></nav></header>
<section class="band cloth lilac"><h1>Notebooks bound by hand.<br>Clickers printed in small batches.</h1></section>
<div class="wrap"><section class="grid">
<div class="tile"><div class="cloth pink"><i></i></div><div class="meta"><b>Notebook</b><span>$— · 4 left</span></div></div>
<div class="tile"><div class="cloth blue"><i></i></div><div class="meta"><b>Clicker</b><span>2 for $—</span></div></div>
<div class="tile"><div class="cloth grey"><i></i></div><div class="meta"><b>Notebook</b><span>All gone</span></div></div>
</section>
<aside class="card"><div class="c c3"></div><div class="c c2"></div><div class="c c1"><h2>Order sheet</h2><small class="num">No. 0001</small><div class="line"></div><div class="line"></div><div class="line"></div><div class="tot">Total $— CAD</div><div class="go">Send to the maker</div></div></aside></div>
</body></html>
